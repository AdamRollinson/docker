[supervisord]
nodaemon=true
logfile=/dev/stderr
logfile_maxbytes=0
loglevel=info
pidfile=/var/run/supervisord.pid
minfds=1024
minprocs=200
user=root

[program:cron]
command=/usr/local/bin/run-service cron /usr/sbin/crond -f -l 8 -L /dev/stderr
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[include]
files = /etc/supervisord.d/*.conf
