version: 2

# Every version update across all ecosystems arrives as one weekly pull request against develop,
# instead of one pull request per dependency against main. Dependabot reads this file from the
# default branch (main), so it lives there even though the pull requests target develop.
# Security updates are not grouped this way: Dependabot always opens them against main.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
    # target-branch belongs here: Dependabot rejects it on updates that are part of the group
    target-branch: develop
    labels:
      - dependencies

updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies

  # Keeps the digest-pinned alpine image current. alpine/base and the php-slim stage in
  # alpine/php pin the same digest, so both move together in the grouped weekly PR.
  - package-ecosystem: docker
    directories:
      - /alpine/base
      - /alpine/php
    patterns: ["*"]
    multi-ecosystem-group: dependencies

  # Documentation site dependencies
  - package-ecosystem: npm
    directory: /docs
    patterns: ["*"]
    multi-ecosystem-group: dependencies
