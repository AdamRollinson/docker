version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Keeps the digest-pinned alpine base image current
  - package-ecosystem: docker
    directory: /alpine/base
    schedule:
      interval: weekly

  # Documentation site dependencies
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    groups:
      nuxt:
        patterns:
          - "nuxt"
          - "@nuxt/*"
          - "@nuxtjs/*"
          - "nuxt-*"
