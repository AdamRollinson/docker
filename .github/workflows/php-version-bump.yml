name: Bump Pinned PHP Versions

# Checks php.net every four hours for newer PHP releases (and PECL for patch releases of the
# extensions in alpine/php/pecl-extensions.txt, and GitHub and go.dev for the FrankenPHP and Go
# releases in alpine/frankenphp/frankenphp-version.txt). When one appears, the pin with its checksum
# and tarball URL is updated in alpine/php-versions.txt, the change is recorded on the
# documentation changelog, both are committed to main and the Docker build workflow is
# dispatched so the new images are compiled and pushed without manual intervention.

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: php-version-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare pinned releases with php.net and PECL
        run: alpine/check-php-versions.sh --update

      - name: Record the change on the docs changelog
        run: alpine/changelog.sh

      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so the build
      # workflow is dispatched explicitly after the commit lands.
      - name: Commit bump and trigger build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet alpine/php-versions.txt alpine/php/pecl-extensions.txt alpine/frankenphp/frankenphp-version.txt; then
            echo "Nothing to bump"
            exit 0
          fi
          releases=$( { git diff -U0 alpine/php-versions.txt | awk '/^\+[0-9]/ { print $2 }'
                        git diff -U0 alpine/php/pecl-extensions.txt | awk '/^\+[a-z]/ { print $2 " " $3 }'
                        git diff -U0 alpine/frankenphp/frankenphp-version.txt | awk '/^\+[a-z]/ { print substr($1, 2) " " $2 }'; } \
                      | paste -sd, - | sed 's/,/, /g')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Bump pinned PHP releases to ${releases}"
          git push origin HEAD:main
          gh workflow run docker-build.yml --ref main
          echo "Bumped to ${releases} and dispatched docker-build.yml"
          echo "releases=${releases}" >> "$GITHUB_OUTPUT"
        id: bump

      - name: Notify
        if: steps.bump.outputs.releases != ''
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          alpine/notify.sh info "PHP pins bumped to ${{ steps.bump.outputs.releases }}" \
            "php.net or PECL published these releases; the image build has been dispatched and will notify again when it publishes." \
            "${{ github.server_url }}/${{ github.repository }}/actions/workflows/docker-build.yml"
