name: Docker Multi-Arch Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # Documentation, Markdown and the docs workflow never affect the images, so pushes that
    # touch only those paths do not rebuild or republish anything. A push is skipped only
    # when every changed file matches; mixed commits still build.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
      - ".github/workflows/docs-ci.yml"
      - ".github/dependabot.yml"
  # Weekly rebuild so Alpine package fixes ship even when nothing in the repo changes
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read
  # id-token lets cosign sign images keylessly with this workflow's OIDC identity
  id-token: write

env:
  DOCKER_USER: ${{ vars.DOCKER_USER }}
  DOCKER_REGISTRY: rollogi
  BASE_IMAGE: base
  PHP_IMAGE: php
  PHP_NGINX_IMAGE: php-nginx
  PHP_NGINX_DEV_IMAGE: php-nginx-dev
  PHP_FPM_IMAGE: php-fpm
  PHP_DEV_IMAGE: php-dev
  PHP_SLIM_IMAGE: php-slim
  BUILDX_VERSION: v0.38.1
  # Images are pushed under this tag first, scanned, and only then promoted to their real tags
  CANDIDATE_TAG: candidate-${{ github.sha }}

# Each architecture is built natively (ubuntu-24.04 for amd64, ubuntu-24.04-arm for arm64), no
# QEMU. A build job pushes its single-platform image by digest, scans and smoke tests it on that
# architecture, and hands the digest to a publish job through an artifact. The publish job joins
# the two digests into one manifest list under the candidate tag, attaches the VEX statement,
# promotes it to the real tags, signs it and removes the candidate tag.
jobs:
  # Read the pinned PHP releases from alpine/php-versions.txt into two matrices: one entry per
  # minor (publish jobs) and one per minor and architecture (build jobs).
  php-matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
      build_matrix: ${{ steps.versions.outputs.build_matrix }}
      apk: ${{ steps.apk.outputs.hash }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned PHP versions
        id: versions
        run: |
          # tag: the moving tag. The bare minor for a final release; a channel tag such as 8.6-rc
          # for a pre-release pin (8.6.0_rc3), so php:8.6 only appears once 8.6.0 is pinned.
          versions=$(grep -Ev '^[[:space:]]*(#|$)' alpine/php-versions.txt \
            | jq -Rcn '[inputs | [splits("\\s+")] | map(select(. != ""))
                | {minor: .[0], patch: .[1], sha256: .[2], url: .[3]}
                | . + {prerelease: (.patch | test("_")),
                       tag: (if (.patch | test("_")) then .minor + "-" + (.patch | capture("_(?<p>[a-z]+)").p) else .minor end)}]')
          matrix=$(jq -cn --argjson v "$versions" '{include: $v}')
          build_matrix=$(jq -cn --argjson v "$versions" '{include: [
              $v[] as $x
              | ({arch: "amd64", platform: "linux/amd64", runner: "ubuntu-24.04"},
                 {arch: "arm64", platform: "linux/arm64", runner: "ubuntu-24.04-arm"})
              | . + $x]}')
          echo "Matrix: $matrix"
          echo "Build matrix: $build_matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "build_matrix=$build_matrix" >> "$GITHUB_OUTPUT"

      # Passed to every build as APK_INDEX_HASH, declared just before each apk step, so a cached
      # apk layer is only reused while Alpine has published nothing new. Without it the weekly run
      # reuses the first build's packages and never picks up Alpine security fixes.
      - name: Hash Alpine package indexes
        id: apk
        run: |
          hash=$(alpine/apk-index-hash.sh)
          echo "Alpine package index hash: $hash"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

  # ---- Base image ---------------------------------------------------------------------------
  build-base:
    needs: php-matrix
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64, runner: ubuntu-24.04 }
          - { arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver: docker-container

      - name: Build Base Image (${{ matrix.arch }}) locally
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: ${{ matrix.platform }}
          context: ./alpine/base
          cache-from: type=gha,scope=base-${{ matrix.arch }}
          build-args: |
            APK_INDEX_HASH=${{ needs.php-matrix.outputs.apk }}
          cache-to: type=gha,mode=max,scope=base-${{ matrix.arch }}
          load: true
          tags: local/${{ env.BASE_IMAGE }}
          provenance: false
          sbom: false

      # The local copy is built without attestations (the runner's daemon cannot load a manifest list),
      # scanned and tested here, and only then rebuilt from the cache and pushed by digest
      - name: Run Trivy vulnerability scanner on Base Image (${{ matrix.arch }})
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ env.BASE_IMAGE }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Smoke test Base Image (${{ matrix.arch }})
        run: alpine/test.sh base local/${{ env.BASE_IMAGE }}

      # The same build again from the cache, with attestations, pushed by digest only now that the
      # local copy has passed the scan and the smoke tests
      - name: Build Base Image (${{ matrix.arch }}) by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: ${{ matrix.platform }}
          context: ./alpine/base
          cache-from: type=gha,scope=base-${{ matrix.arch }}
          build-args: |
            APK_INDEX_HASH=${{ needs.php-matrix.outputs.apk }}
          outputs: type=image,name=${{ env.DOCKER_REGISTRY }}/${{ env.BASE_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-base-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-base:
    needs: build-base
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ env.BUILDX_VERSION }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-base-*
          merge-multiple: true

      # Join the per-architecture images into one manifest list under the candidate tag
      - name: Create Base Image candidate manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          [ "$(ls | wc -l)" -eq 2 ] || { echo "expected one digest per architecture, found: $(ls)"; exit 1; }
          docker buildx imagetools create -t "${DOCKER_REGISTRY}/${BASE_IMAGE}:${CANDIDATE_TAG}" \
            $(printf "${DOCKER_REGISTRY}/${BASE_IMAGE}@sha256:%s " *)

      - name: Attach VEX attestation to Base Image candidate
        uses: docker/scout-action@221e7f4860634eeb1579e3bd7ca232e577bd1864 # v1.26.0
        with:
          command: attestation-add
          image: ${{ env.DOCKER_REGISTRY }}/${{ env.BASE_IMAGE }}:${{ env.CANDIDATE_TAG }}
          file: .vex/openvex.json
          predicate-type: https://openvex.dev/ns/v0.2.0

      - name: Promote Base Image
        run: |
          docker buildx imagetools create \
            -t ${{ env.DOCKER_REGISTRY }}/${{ env.BASE_IMAGE }}:latest \
            ${{ env.DOCKER_REGISTRY }}/${{ env.BASE_IMAGE }}:${{ env.CANDIDATE_TAG }}

      # Keyless Sigstore signature on the promoted manifest list. The certificate identity is this
      # workflow on the main branch; see docs/security/scanning-and-attestations for how to verify.
      - name: Sign Base Image
        run: |
          digest=$(docker buildx imagetools inspect ${{ env.DOCKER_REGISTRY }}/${{ env.BASE_IMAGE }}:latest --format '{{.Manifest.Digest}}')
          cosign sign --yes --recursive "${{ env.DOCKER_REGISTRY }}/${{ env.BASE_IMAGE }}@${digest}"

      - name: Remove Base Image candidate tag
        if: always()
        continue-on-error: true
        env:
          DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
        run: |
          token=$(curl -sS -H "Content-Type: application/json" -X POST \
            -d "{\"username\": \"${DOCKER_USER}\", \"password\": \"${DOCKER_PAT}\"}" \
            https://hub.docker.com/v2/users/login/ | jq -r .token)
          curl -sS -o /dev/null -w "delete ${BASE_IMAGE}:${CANDIDATE_TAG} -> %{http_code}\n" -X DELETE \
            -H "Authorization: JWT ${token}" \
            "https://hub.docker.com/v2/repositories/${DOCKER_REGISTRY}/${BASE_IMAGE}/tags/${CANDIDATE_TAG}/"

  # ---- PHP images, one native build job per minor and architecture ---------------------------
  # php -> php-nginx -> php-nginx-dev are chained on the same runner, each FROM the digest the
  # previous step just pushed, so a minor never waits on another minor or on the other arch.
  build-php:
    needs: [php-matrix, publish-base]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.php-matrix.outputs.build_matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver: docker-container

      - name: Prepare Clean PHP Version
        run: echo "PHP_VERSION=$(echo ${{ matrix.minor }} | tr -d '.')" >> $GITHUB_ENV

      # ---- PHP image ----------------------------------------------------------
      - name: Build PHP Image (${{ matrix.minor }}, ${{ matrix.arch }}) locally
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: ${{ matrix.platform }}
          context: ./alpine/php
          cache-from: type=gha,scope=php-${{ matrix.minor }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=php-${{ matrix.minor }}-${{ matrix.arch }}
          pull: true
          build-args: |
            APK_INDEX_HASH=${{ needs.php-matrix.outputs.apk }}
            PHP_VERSION=${{ env.PHP_VERSION }}
            PHP_PATCH_VERSION=${{ matrix.patch }}
            PHP_SOURCE_URL=${{ matrix.url }}
            PHP_SOURCE_SHA256=${{ matrix.sha256 }}
          load: true
          tags: local/${{ env.PHP_IMAGE }}
          provenance: false
          sbom: false

      - name: Run Trivy vulnerability scanner on PHP Image (${{ matrix.minor }}, ${{ matrix.arch }})
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ env.PHP_IMAGE }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Smoke test PHP Image (${{ matrix.minor }}, ${{ matrix.arch }})
        run: alpine/test.sh php local/${{ env.PHP_IMAGE }} ${{ matrix.patch }}

      # The same build again from the cache, with attestations, pushed by digest only now that the
      # local copy has passed the scan and the smoke tests
      - name: Build PHP Image (${{ matrix.minor }}, ${{ matrix.arch }}) by digest
        id: php
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: ${{ matrix.platform }}
          context: ./alpine/php
          cache-from: type=gha,scope=php-${{ matrix.minor }}-${{ matrix.arch }}
          build-args: |
            APK_INDEX_HASH=${{ needs.php-matrix.outputs.apk }}
            PHP_VERSION=${{ env.PHP_VERSION }}
            PHP_PATCH_VERSION=${{ matrix.patch }}
            PHP_SOURCE_URL=${{ matrix.url }}
            PHP_SOURCE_SHA256=${{ matrix.sha256 }}
          outputs: type=image,name=${{ env.DOCKER_REGISTRY }}/${{ env.PHP_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true

      # ---- PHP-SLIM image (the slim target of the same Dockerfile) -------------
      # Reads the php scope so the compiled build stage comes from the cache, and writes its own
      # scope so it never replaces the php image's cache entries
      - name: Build PHP-SLIM Image (${{ matrix.minor }}, ${{ matrix.arch }}) locally
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: ${{ matrix.platform }}
          context: ./alpine/php
          target: slim
          cache-from: |
            type=gha,scope=php-${{ matrix.minor }}-${{ matrix.arch }}
            type=gha,scope=php-slim-${{ matrix.minor }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=php-slim-${{ matrix.minor }}-${{ matrix.arch }}
          build-args: |
            APK_INDEX_HASH=${{ needs.php-matrix.outputs.apk }}
            PHP_VERSION=${{ env.PHP_VERSION }}
            PHP_PATCH_VERSION=${{ matrix.patch }}
            PHP_SOURCE_URL=${{ matrix.url }}
            PHP_SOURCE_SHA256=${{ matrix.sha256 }}
          load: true
          tags: local/${{ env.PHP_SLIM_IMAGE }}
          provenance: false
          sbom: false

      - name: Run Trivy vulnerability scanner on PHP-SLIM Image (${{ matrix.minor }}, ${{ matrix.arch }})
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ env.PHP_SLIM_IMAGE }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Smoke test PHP-SLIM Image (${{ matrix.minor }}, ${{ matrix.arch }})
        run: alpine/test.sh php-slim local/${{ env.PHP_SLIM_IMAGE }} ${{ matrix.patch }} local/${{ env.PHP_IMAGE }}

      - name: Build PHP-SLIM Image (${{ matrix.minor }}, ${{ matrix.arch }}) by digest
        id: php-slim
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: ${{ matrix.platform }}
          context: ./alpine/php
          target: slim
          cache-from: |
            type=gha,scope=php-${{ matrix.minor }}-${{ matrix.arch }}
            type=gha,scope=php-slim-${{ matrix.minor }}-${{ matrix.arch }}
          build-args: |
            APK_INDEX_HASH=${{ needs.php-matrix.outputs.apk }}
            PHP_VERSION=${{ env.PHP_VERSION }}
            PHP_PATCH_VERSION=${{ matrix.patch }}
            PHP_SOURCE_URL=${{ matrix.url }}
            PHP_SOURCE_SHA256=${{ matrix.sha256 }}
          outputs: type=image,name=${{ env.DOCKER_REGISTRY }}/${{ env.PHP_SLIM_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true

      # ---- PHP-NGINX image (FROM the php digest above) -------------------------
      - name: Build PHP-NGINX Image (${{ matrix.minor }}, ${{ matrix.arch }}) locally
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: ${{ matrix.platform }}
          context: ./alpine/php-nginx
          cache-from: type=gha,scope=php-nginx-${{ matrix.minor }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=php-nginx-${{ matrix.minor }}-${{ matrix.arch }}
          build-args: |
            APK_INDEX_HASH=${{ needs.php-matrix.outputs.apk }}
            PHP_IMAGE=${{ env.DOCKER_REGISTRY }}/${{ env.PHP_IMAGE }}@${{ steps.php.outputs.digest }}
            PHP_IMAGE_TAG=${{ matrix.tag }}
            PHP_VERSION=${{ env.PHP_VERSION }}
          load: true
          tags: local/${{ env.PHP_NGINX_IMAGE }}
          provenance: false
          sbom: false

      - name: Run Trivy vulnerability scanner on PHP-NGINX Image (${{ matrix.minor }}, ${{ matrix.arch }})
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ env.PHP_NGINX_IMAGE }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Smoke test PHP-NGINX Image (${{ matrix.minor }}, ${{ matrix.arch }})
        run: alpine/test.sh php-nginx local/${{ env.PHP_NGINX_IMAGE }} ${{ matrix.patch }}

      # The same build again from the cache, with attestations, pushed by digest only now that the
      # local copy has passed the scan and the smoke tests
      - name: Build PHP-NGINX Image (${{ matrix.minor }}, ${{ matrix.arch }}) by digest
        id: php-nginx
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: ${{ matrix.platform }}
          context: ./alpine/php-nginx
          cache-from: type=gha,scope=php-nginx-${{ matrix.minor }}-${{ matrix.arch }}
          build-args: |
            APK_INDEX_HASH=${{ needs.php-matrix.outputs.apk }}
            PHP_IMAGE=${{ env.DOCKER_REGISTRY }}/${{ env.PHP_IMAGE }}@${{ steps.php.outputs.digest }}
            PHP_IMAGE_TAG=${{ matrix.tag }}
            PHP_VERSION=${{ env.PHP_VERSION }}
          outputs: type=image,name=${{ env.DOCKER_REGISTRY }}/${{ env.PHP_NGINX_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true

      # ---- PHP-NGINX-DEV image (FROM the php-nginx digest above) ---------------
      - name: Build PHP-NGINX-DEV Image (${{ matrix.minor }}, ${{ matrix.arch }}) locally
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: ${{ matrix.platform }}
          context: ./alpine/php-nginx-dev
          cache-from: type=gha,scope=php-nginx-dev-${{ matrix.minor }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=php-nginx-dev-${{ matrix.minor }}-${{ matrix.arch }}
          build-args: |
            APK_INDEX_HASH=${{ needs.php-matrix.outputs.apk }}
            PHP_IMAGE=${{ env.DOCKER_REGISTRY }}/${{ env.PHP_NGINX_IMAGE }}@${{ steps.php-nginx.outputs.digest }}
            PHP_IMAGE_TAG=${{ matrix.tag }}
            PHP_VERSION=${{ env.PHP_VERSION }}
          load: true
          tags: local/${{ env.PHP_NGINX_DEV_IMAGE }}
          provenance: false
          sbom: false

      - name: Run Trivy vulnerability scanner on PHP-NGINX-DEV Image (${{ matrix.minor }}, ${{ matrix.arch }})
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ env.PHP_NGINX_DEV_IMAGE }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Smoke test PHP-NGINX-DEV Image (${{ matrix.minor }}, ${{ matrix.arch }})
        run: alpine/test.sh php-nginx-dev local/${{ env.PHP_NGINX_DEV_IMAGE }} ${{ matrix.patch }}

      # The same build again from the cache, with attestations, pushed by digest only now that the
      # local copy has passed the scan and the smoke tests
      - name: Build PHP-NGINX-DEV Image (${{ matrix.minor }}, ${{ matrix.arch }}) by digest
        id: php-nginx-dev
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: ${{ matrix.platform }}
          context: ./alpine/php-nginx-dev
          cache-from: type=gha,scope=php-nginx-dev-${{ matrix.minor }}-${{ matrix.arch }}
          build-args: |
            APK_INDEX_HASH=${{ needs.php-matrix.outputs.apk }}
            PHP_IMAGE=${{ env.DOCKER_REGISTRY }}/${{ env.PHP_NGINX_IMAGE }}@${{ steps.php-nginx.outputs.digest }}
            PHP_IMAGE_TAG=${{ matrix.tag }}
            PHP_VERSION=${{ env.PHP_VERSION }}
          outputs: type=image,name=${{ env.DOCKER_REGISTRY }}/${{ env.PHP_NGINX_DEV_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true

      # ---- PHP-FPM image (FROM the php digest, alongside php-nginx) -------------
      - name: Build PHP-FPM Image (${{ matrix.minor }}, ${{ matrix.arch }}) locally
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: ${{ matrix.platform }}
          context: ./alpine/php-fpm
          cache-from: type=gha,scope=php-fpm-${{ matrix.minor }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=php-fpm-${{ matrix.minor }}-${{ matrix.arch }}
          build-args: |
            APK_INDEX_HASH=${{ needs.php-matrix.outputs.apk }}
            PHP_IMAGE=${{ env.DOCKER_REGISTRY }}/${{ env.PHP_IMAGE }}@${{ steps.php.outputs.digest }}
            PHP_IMAGE_TAG=${{ matrix.tag }}
            PHP_VERSION=${{ env.PHP_VERSION }}
          load: true
          tags: local/${{ env.PHP_FPM_IMAGE }}
          provenance: false
          sbom: false

      - name: Run Trivy vulnerability scanner on PHP-FPM Image (${{ matrix.minor }}, ${{ matrix.arch }})
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ env.PHP_FPM_IMAGE }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Smoke test PHP-FPM Image (${{ matrix.minor }}, ${{ matrix.arch }})
        run: alpine/test.sh php-fpm local/${{ env.PHP_FPM_IMAGE }} ${{ matrix.patch }}

      - name: Build PHP-FPM Image (${{ matrix.minor }}, ${{ matrix.arch }}) by digest
        id: php-fpm
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: ${{ matrix.platform }}
          context: ./alpine/php-fpm
          cache-from: type=gha,scope=php-fpm-${{ matrix.minor }}-${{ matrix.arch }}
          build-args: |
            APK_INDEX_HASH=${{ needs.php-matrix.outputs.apk }}
            PHP_IMAGE=${{ env.DOCKER_REGISTRY }}/${{ env.PHP_IMAGE }}@${{ steps.php.outputs.digest }}
            PHP_IMAGE_TAG=${{ matrix.tag }}
            PHP_VERSION=${{ env.PHP_VERSION }}
          outputs: type=image,name=${{ env.DOCKER_REGISTRY }}/${{ env.PHP_FPM_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true

      # ---- PHP-DEV image (FROM the php digest, alongside php-nginx) -------------
      - name: Build PHP-DEV Image (${{ matrix.minor }}, ${{ matrix.arch }}) locally
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: ${{ matrix.platform }}
          context: ./alpine/php-dev
          cache-from: type=gha,scope=php-dev-${{ matrix.minor }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=php-dev-${{ matrix.minor }}-${{ matrix.arch }}
          build-args: |
            APK_INDEX_HASH=${{ needs.php-matrix.outputs.apk }}
            PHP_IMAGE=${{ env.DOCKER_REGISTRY }}/${{ env.PHP_IMAGE }}@${{ steps.php.outputs.digest }}
            PHP_IMAGE_TAG=${{ matrix.tag }}
            PHP_VERSION=${{ env.PHP_VERSION }}
          load: true
          tags: local/${{ env.PHP_DEV_IMAGE }}
          provenance: false
          sbom: false

      - name: Run Trivy vulnerability scanner on PHP-DEV Image (${{ matrix.minor }}, ${{ matrix.arch }})
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ env.PHP_DEV_IMAGE }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Smoke test PHP-DEV Image (${{ matrix.minor }}, ${{ matrix.arch }})
        run: alpine/test.sh php-dev local/${{ env.PHP_DEV_IMAGE }} ${{ matrix.patch }}

      - name: Build PHP-DEV Image (${{ matrix.minor }}, ${{ matrix.arch }}) by digest
        id: php-dev
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: ${{ matrix.platform }}
          context: ./alpine/php-dev
          cache-from: type=gha,scope=php-dev-${{ matrix.minor }}-${{ matrix.arch }}
          build-args: |
            APK_INDEX_HASH=${{ needs.php-matrix.outputs.apk }}
            PHP_IMAGE=${{ env.DOCKER_REGISTRY }}/${{ env.PHP_IMAGE }}@${{ steps.php.outputs.digest }}
            PHP_IMAGE_TAG=${{ matrix.tag }}
            PHP_VERSION=${{ env.PHP_VERSION }}
          outputs: type=image,name=${{ env.DOCKER_REGISTRY }}/${{ env.PHP_DEV_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true

      # One file per image, named "<image> <digest>", so the publish job can join them
      - name: Export digests
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          for pair in "${PHP_IMAGE} ${{ steps.php.outputs.digest }}" \
                      "${PHP_NGINX_IMAGE} ${{ steps.php-nginx.outputs.digest }}" \
                      "${PHP_NGINX_DEV_IMAGE} ${{ steps.php-nginx-dev.outputs.digest }}" \
                      "${PHP_FPM_IMAGE} ${{ steps.php-fpm.outputs.digest }}" \
                      "${PHP_DEV_IMAGE} ${{ steps.php-dev.outputs.digest }}" \
                      "${PHP_SLIM_IMAGE} ${{ steps.php-slim.outputs.digest }}"; do
            set -- $pair
            touch "${{ runner.temp }}/digests/$1 ${2#sha256:}"
          done
          ls -1 "${{ runner.temp }}/digests"

      - name: Upload digests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-php-${{ matrix.minor }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # ---- Publish, one job per minor --------------------------------------------------------------
  # Runs as long as the workflow was not cancelled, so a failing minor never blocks the others:
  # a minor whose build legs failed has no digests and fails here on its own.
  publish-php:
    needs: [php-matrix, build-php]
    if: ${{ !cancelled() && needs.php-matrix.result == 'success' && needs.build-php.result != 'skipped' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.php-matrix.outputs.matrix) }}
    runs-on: ubuntu-24.04
    steps:
      # Every image published for this minor, in dependency order (php before the images on it)
      - name: Select images (${{ matrix.minor }})
        run: echo "IMAGES=${PHP_IMAGE} ${PHP_NGINX_IMAGE} ${PHP_NGINX_DEV_IMAGE} ${PHP_FPM_IMAGE} ${PHP_DEV_IMAGE} ${PHP_SLIM_IMAGE}" >> "$GITHUB_ENV"

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ env.BUILDX_VERSION }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-php-${{ matrix.minor }}-*
          merge-multiple: true

      - name: Create candidate manifest lists (${{ matrix.minor }})
        working-directory: ${{ runner.temp }}/digests
        run: |
          for repo in ${IMAGES}; do
            refs=$(for f in "${repo} "*; do printf '%s@sha256:%s ' "${DOCKER_REGISTRY}/${repo}" "${f#* }"; done)
            [ "$(echo $refs | wc -w)" -eq 2 ] || { echo "expected one ${repo} digest per architecture, found: $(ls)"; exit 1; }
            docker buildx imagetools create -t "${DOCKER_REGISTRY}/${repo}:${CANDIDATE_TAG}-${{ matrix.minor }}" $refs
          done

      - name: Attach VEX attestation to PHP Image (${{ matrix.minor }}) candidate
        uses: docker/scout-action@221e7f4860634eeb1579e3bd7ca232e577bd1864 # v1.26.0
        with:
          command: attestation-add
          image: ${{ env.DOCKER_REGISTRY }}/${{ env.PHP_IMAGE }}:${{ env.CANDIDATE_TAG }}-${{ matrix.minor }}
          file: .vex/openvex.json
          predicate-type: https://openvex.dev/ns/v0.2.0

      - name: Attach VEX attestation to PHP-NGINX Image (${{ matrix.minor }}) candidate
        uses: docker/scout-action@221e7f4860634eeb1579e3bd7ca232e577bd1864 # v1.26.0
        with:
          command: attestation-add
          image: ${{ env.DOCKER_REGISTRY }}/${{ env.PHP_NGINX_IMAGE }}:${{ env.CANDIDATE_TAG }}-${{ matrix.minor }}
          file: .vex/openvex.json
          predicate-type: https://openvex.dev/ns/v0.2.0

      - name: Attach VEX attestation to PHP-NGINX-DEV Image (${{ matrix.minor }}) candidate
        uses: docker/scout-action@221e7f4860634eeb1579e3bd7ca232e577bd1864 # v1.26.0
        with:
          command: attestation-add
          image: ${{ env.DOCKER_REGISTRY }}/${{ env.PHP_NGINX_DEV_IMAGE }}:${{ env.CANDIDATE_TAG }}-${{ matrix.minor }}
          file: .vex/openvex.json
          predicate-type: https://openvex.dev/ns/v0.2.0

      - name: Attach VEX attestation to PHP-FPM Image (${{ matrix.minor }}) candidate
        uses: docker/scout-action@221e7f4860634eeb1579e3bd7ca232e577bd1864 # v1.26.0
        with:
          command: attestation-add
          image: ${{ env.DOCKER_REGISTRY }}/${{ env.PHP_FPM_IMAGE }}:${{ env.CANDIDATE_TAG }}-${{ matrix.minor }}
          file: .vex/openvex.json
          predicate-type: https://openvex.dev/ns/v0.2.0

      - name: Attach VEX attestation to PHP-DEV Image (${{ matrix.minor }}) candidate
        uses: docker/scout-action@221e7f4860634eeb1579e3bd7ca232e577bd1864 # v1.26.0
        with:
          command: attestation-add
          image: ${{ env.DOCKER_REGISTRY }}/${{ env.PHP_DEV_IMAGE }}:${{ env.CANDIDATE_TAG }}-${{ matrix.minor }}
          file: .vex/openvex.json
          predicate-type: https://openvex.dev/ns/v0.2.0

      - name: Attach VEX attestation to PHP-SLIM Image (${{ matrix.minor }}) candidate
        uses: docker/scout-action@221e7f4860634eeb1579e3bd7ca232e577bd1864 # v1.26.0
        with:
          command: attestation-add
          image: ${{ env.DOCKER_REGISTRY }}/${{ env.PHP_SLIM_IMAGE }}:${{ env.CANDIDATE_TAG }}-${{ matrix.minor }}
          file: .vex/openvex.json
          predicate-type: https://openvex.dev/ns/v0.2.0

      # The moving tag (matrix.tag: the minor, or a channel tag such as 8.6-rc for a pre-release)
      # and the immutable exact tag, in dependency order so php exists before php-nginx is visible
      - name: Promote images (${{ matrix.minor }})
        run: |
          for repo in ${IMAGES}; do
            docker buildx imagetools create \
              -t "${DOCKER_REGISTRY}/${repo}:${{ matrix.tag }}" \
              -t "${DOCKER_REGISTRY}/${repo}:${{ matrix.patch }}" \
              "${DOCKER_REGISTRY}/${repo}:${CANDIDATE_TAG}-${{ matrix.minor }}"
          done

      # Keyless Sigstore signature on each promoted manifest list. The certificate identity is this
      # workflow on the main branch; see docs/security/scanning-and-attestations for how to verify.
      - name: Sign images (${{ matrix.minor }})
        run: |
          for repo in ${IMAGES}; do
            digest=$(docker buildx imagetools inspect "${DOCKER_REGISTRY}/${repo}:${{ matrix.tag }}" --format '{{.Manifest.Digest}}')
            cosign sign --yes --recursive "${DOCKER_REGISTRY}/${repo}@${digest}"
          done

      - name: Verify Built Images
        run: |
          for repo in ${IMAGES}; do
            docker buildx imagetools inspect "${DOCKER_REGISTRY}/${repo}:${{ matrix.tag }}"
          done

      # One marker per promoted minor, so the release job only releases what this run published
      - name: Record promotion (${{ matrix.minor }})
        run: |
          mkdir -p "${{ runner.temp }}/published"
          echo "${{ matrix.patch }}" > "${{ runner.temp }}/published/${{ matrix.minor }}"

      - name: Upload promotion marker
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-${{ matrix.minor }}
          path: ${{ runner.temp }}/published/*
          if-no-files-found: error
          retention-days: 1

      - name: Remove candidate tags
        if: always()
        continue-on-error: true
        env:
          DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
        run: |
          token=$(curl -sS -H "Content-Type: application/json" -X POST \
            -d "{\"username\": \"${DOCKER_USER}\", \"password\": \"${DOCKER_PAT}\"}" \
            https://hub.docker.com/v2/users/login/ | jq -r .token)
          for repo in ${IMAGES}; do
            curl -sS -o /dev/null -w "delete ${repo}:${CANDIDATE_TAG}-${{ matrix.minor }} -> %{http_code}\n" -X DELETE \
              -H "Authorization: JWT ${token}" \
              "https://hub.docker.com/v2/repositories/${DOCKER_REGISTRY}/${repo}/tags/${CANDIDATE_TAG}-${{ matrix.minor }}/"
          done

  # ---- Release notes and notifications ---------------------------------------------------------
  # One GitHub release per published PHP release, tagged php-<release> (for example php-8.4.27),
  # with the manifest digest of each image. Idempotent: a release that already exists is left
  # alone, and a minor that publish-php did not promote in this run is skipped (it has no marker
  # artifact), so a tag left on Docker Hub by an earlier run can never be released from this one.
  release:
    needs: [php-matrix, publish-php]
    if: ${{ !cancelled() && needs.php-matrix.result == 'success' && needs.publish-php.result != 'skipped' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ env.BUILDX_VERSION }}

      - name: Download promotion markers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/published
          pattern: published-*
          merge-multiple: true

      - name: Create GitHub releases for newly published PHP releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          PUBLISHED_DIR: ${{ runner.temp }}/published
        run: |
          echo '${{ needs.php-matrix.outputs.matrix }}' | jq -r '.include[] | "\(.minor) \(.patch) \(.tag) \(.prerelease)"' \
          | while read -r minor patch tag prerelease; do
            name="php-${patch}"
            if [ "$(cat "${PUBLISHED_DIR}/${minor}" 2>/dev/null)" != "$patch" ]; then
              echo "${name}: not promoted in this run, skipping"
              continue
            fi
            if gh release view "$name" >/dev/null 2>&1; then
              echo "${name}: release exists, skipping"
              continue
            fi
            if ! alpine/release-notes.sh "$minor" "$patch" "$tag" "$GITHUB_SHA" > "notes-${patch}.md"; then
              echo "${name}: images not published in this run, skipping"
              continue
            fi
            flags=(--latest=false)
            [ "$prerelease" = "true" ] && flags+=(--prerelease)
            gh release create "$name" --target "$GITHUB_SHA" --title "PHP ${patch}" --notes-file "notes-${patch}.md" "${flags[@]}"
            echo "${name}: created"
          done

  # Optional webhook (Slack, Discord, Mattermost, Teams via a connector, anything accepting JSON):
  # set the NOTIFY_WEBHOOK_URL secret and every run reports what it published or where it failed.
  notify:
    needs: [php-matrix, publish-base, publish-php, release]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Send notification
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          RESULTS: ${{ toJSON(needs) }}
          MATRIX: ${{ needs.php-matrix.outputs.matrix }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$NOTIFY_WEBHOOK_URL" ] || { echo "NOTIFY_WEBHOOK_URL not set, skipping notification"; exit 0; }
          summary=$(echo "$RESULTS" | jq -r 'to_entries | map("\(.key): \(.value.result)") | join(", ")')
          versions=$(echo "$MATRIX" | jq -r '[.include[] | .patch] | join(", ")' 2>/dev/null || echo "unknown")
          if echo "$RESULTS" | jq -e '[.[] | .result] | any(. == "failure" or . == "cancelled")' >/dev/null; then
            alpine/notify.sh failure "Docker image build failed (${GITHUB_REF_NAME} @ ${GITHUB_SHA::12})" \
              "Jobs: ${summary}. PHP pins: ${versions}." "$RUN_URL"
          else
            alpine/notify.sh success "Docker images published (${GITHUB_REF_NAME} @ ${GITHUB_SHA::12})" \
              "PHP ${versions} for linux/amd64 and linux/arm64, scanned, tested and signed. Jobs: ${summary}." "$RUN_URL"
          fi
